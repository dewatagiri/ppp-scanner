name: scan

on:
  schedule:
    # All times UTC, Monday-Friday, about 45 min after each bourse closes.
    - cron: "15 7 * * 1-5"    # Tokyo   (close 15:30 JST = 06:30 UTC)
    - cron: "45 8 * * 1-5"    # Hong Kong (close 16:00 HKT = 08:00 UTC)
    - cron: "45 9 * * 1-5"    # Singapore, Kuala Lumpur, Jakarta (close 09:00 UTC)
    - cron: "15 17 * * 1-5"   # London  (close 16:30 = 15:30 UTC summer / 16:30 UTC winter)
    - cron: "45 12 * * 1-5"   # New York pre-market (08:45 EDT / 07:45 EST) -> fills "Pre-mkt %"
    - cron: "30 21 * * 1-5"   # New York after close (16:00 = 20:00 UTC summer / 21:00 UTC winter)
    - cron: "30 22 * * 1-5"   # Forex (daily bar rolls 17:00 New York)
  workflow_dispatch:
    inputs:
      bourses:
        description: "Space-separated bourses (US UK JP SG MY ID HK FX) or ALL"
        default: "ALL"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests (look-ahead, 252-bar window, datetime checklist)
        run: python -m unittest discover -s tests -v

      - name: Pick bourses
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.bourses }}
        run: |
          case "$SCHEDULE" in
            "15 7 * * 1-5")  B="JP" ;;
            "45 8 * * 1-5")  B="HK" ;;
            "45 9 * * 1-5")  B="SG MY ID" ;;
            "15 17 * * 1-5") B="UK" ;;
            "45 12 * * 1-5") B="US" ;;
            "30 21 * * 1-5") B="US" ;;
            "30 22 * * 1-5") B="FX" ;;
            *) B="${INPUT:-ALL}" ;;
          esac
          [ "$B" = "ALL" ] && B=""
          echo "bourses=$B" >> "$GITHUB_OUTPUT"

      - name: Scan
        run: python scan.py ${{ steps.pick.outputs.bourses }}

      - name: Commit updated JSON
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "scan: update data [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
